<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>París en 4 días</title>
<meta name="theme-color" content="#1b3f8b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idea: una app de bolsillo con el lenguaje de la calle parisina. Placas de esmalte azul con marco verde
   para los títulos, y cada día dibujado como una línea de metro cuyas estaciones se marcan al visitarlas. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f4f5f8; --ink:#172033; --muted:#566072; --line:#d7dbe2;
  --plaque:#1b3f8b; --plaque-edge:#3a7d5c; --on-plaque:#ffffff; --accent:#1b3f8b;
  --ok:#1f6f4a; --warn:#8f4508; --warn-bg:#fcefdf;
  --water:#a8c9e6; --park:#cbe0c1; --land:#f8f6f0; --outside:#dfe2e6; --road:#e6e1d4;
  --d1:#c2255c; --d2:#1971c2; --d3:#2b8a3e; --d4:#b85c00; --on-day:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d121b; --surface:#161d2a; --surface-2:#1d2535; --ink:#e8ecf3; --muted:#9aa5b7; --line:#2b3446;
    --plaque:#22499c; --plaque-edge:#4f9a76; --on-plaque:#ffffff; --accent:#a3bdff;
    --ok:#62c698; --warn:#f0b06a; --warn-bg:#33240f;
    --water:#284a6d; --park:#233f2e; --land:#1b2332; --outside:#111722; --road:#262f40;
    --d1:#f06595; --d2:#4dabf7; --d3:#51cf66; --d4:#ffa94d; --on-day:#0d121b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#161d2a; --surface-2:#1d2535; --ink:#e8ecf3; --muted:#9aa5b7; --line:#2b3446;
  --plaque:#22499c; --plaque-edge:#4f9a76; --on-plaque:#ffffff; --accent:#a3bdff;
  --ok:#62c698; --warn:#f0b06a; --warn-bg:#33240f;
  --water:#284a6d; --park:#233f2e; --land:#1b2332; --outside:#111722; --road:#262f40;
  --d1:#f06595; --d2:#4dabf7; --d3:#51cf66; --d4:#ffa94d; --on-day:#0d121b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}

/* Cabecera */
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.plaque{background:var(--plaque);color:var(--on-plaque);border:3px solid var(--plaque-edge);border-radius:8px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);padding:5px 12px 6px;text-align:center;flex:none}
.plaque small{display:block;font:600 10px/1.2 var(--body);letter-spacing:.14em;opacity:.9}
.plaque b{display:block;font:800 21px/1 var(--display);letter-spacing:.1em}
.status{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.status strong{font:600 15px/1.2 var(--display)}
.status span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}

/* Vistas */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
.h2{font:800 20px/1.15 var(--display);text-wrap:balance}
.h3{font:600 16px/1.25 var(--display);text-wrap:balance}
.lead{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--body);padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}
.pill.warn{color:var(--warn);border-color:currentColor}
.note{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:14px}
.note b{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);font:600 13px/1.1 var(--body);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--plaque);color:var(--on-plaque);border-color:var(--plaque)}
.btn svg,.walk svg{width:15px;height:15px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Indicadores de línea */
.ln{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:50%;font:700 11px/1 var(--body);vertical-align:-4px;margin-right:2px}
.ln.rer{border-radius:5px;outline:1.5px solid currentColor;outline-offset:-3px}
.walk{display:inline-flex;align-items:center;gap:4px}

/* Selector de día */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0;margin:-8px 0}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:4px solid var(--dc)}
.days button b{font:600 14px/1.1 var(--display)}
.days button span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--dc);border-color:var(--dc);color:var(--on-day)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.9}

/* Placa del día */
.dayplaque{background:var(--plaque);color:var(--on-plaque);border:4px solid var(--plaque-edge);border-radius:10px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);padding:14px 16px 15px;display:flex;flex-direction:column;gap:6px}
.dayplaque .arr{font:600 11px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.dayplaque h2{font:800 23px/1.08 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.dayplaque p{font-size:14px;opacity:.95}
.facts{display:flex;flex-wrap:wrap;gap:6px}

/* Línea del día: cada parada es una estación */
.rail{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;position:relative;padding-bottom:6px}
.stop::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:6px;background:var(--dc);border-radius:0}
.stop:first-child::before{top:22px;border-radius:3px 3px 0 0}
.stop:last-child::before{bottom:auto;height:36px;border-radius:0 0 3px 3px}
.stop:first-child:last-child::before{display:none}
.go{grid-column:2;font-size:13px;color:var(--muted);padding:4px 0 8px;min-height:10px}
.node{grid-column:1;align-self:start;margin-top:8px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:4px solid var(--dc);
  display:grid;place-items:center;position:relative;z-index:1}
.node svg{width:16px;height:16px;opacity:0;color:var(--on-day)}
.stop.done .node{background:var(--dc)}
.stop.done .node svg{opacity:1}
.stop .card{grid-column:2;gap:7px}
.stop.done .card{background:var(--surface-2)}
.stop.done .card h3{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font:800 16px/1 var(--display);font-variant-numeric:tabular-nums}
.dur{font-size:12px;color:var(--muted)}
.cost{margin-left:auto}
.now{background:var(--dc);color:var(--on-day);border-color:var(--dc)}
.stop p{font-size:14px}
.tip{color:var(--muted)}
.tip b{color:var(--ink)}

/* Mapa */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--body);display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--dc)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--outside)}
#map{height:clamp(300px,50vh,480px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map svg{display:block;width:100%;height:100%}
#map text{font-family:var(--body)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font:600 20px/1 var(--body);display:grid;place-items:center}
.zoom button svg{width:18px;height:18px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.legend .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--dc);color:var(--on-day);display:grid;place-items:center;font:700 12px/1 var(--body)}
.legend small{display:block;color:var(--muted);font-size:12px}
.legend b{font-weight:600;font-size:14px}

/* Ficha inferior */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;max-height:72%;overflow-y:auto}
.sheet[hidden]{display:none}
.sheet header{display:flex;gap:10px;align-items:flex-start}
.sheet header h3{flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sheet .x svg{width:16px;height:16px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* Transporte */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;font:600 13px/1 var(--body)}
.seg button[aria-pressed="true"]{background:var(--plaque);color:var(--on-plaque);border-color:var(--plaque)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font:600 13px/1.2 var(--body)}
.field input[type=text]{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;width:100%}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stepper{border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-left:5px solid var(--dc)}
.stepper small{font:600 13px/1.1 var(--body)}
.stepper div{display:flex;align-items:center;gap:4px}
.stepper output{min-width:18px;text-align:center;font:800 17px/1 var(--display);font-variant-numeric:tabular-nums}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font:600 17px/1 var(--body)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.opt.best{border-color:var(--ok);border-width:2px}
.opt .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .l1 b{font:600 15px/1.2 var(--display)}
.opt .amt{margin-left:auto;font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.opt p{font-size:13px;color:var(--muted)}
.opt .bar i{background:var(--muted)}
.opt.best .bar i{background:var(--ok)}
.tickets{display:flex;flex-direction:column;gap:0}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.ticket:first-child{border-top:0;padding-top:0}
.ticket:last-child{padding-bottom:0}
.ticket b{font:600 15px/1.25 var(--display)}
.ticket .p{font:800 16px/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.ticket p{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.ticket .pill{justify-self:start;grid-column:1/-1}
.num-list{counter-reset:n;display:flex;flex-direction:column;gap:10px}
.num-list li{counter-increment:n;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px}
.num-list li::before{content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--plaque);color:var(--on-plaque);display:grid;place-items:center;font:700 13px/1 var(--body)}
.bul{display:flex;flex-direction:column;gap:7px;font-size:14px}
.bul li{padding-left:14px;position:relative}
.bul li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--plaque-edge)}
.lines{display:flex;flex-direction:column;gap:8px;font-size:14px}
.lines li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}

/* Guía */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{font:800 17px/1.2 var(--display)}
.tile span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.phr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px;font-size:14px}
.phr div{padding:7px 0;border-bottom:1px solid var(--line)}
.phr div:nth-last-child(-n+2){border-bottom:0}
.phr i{display:block;font-style:normal;font-size:12px;color:var(--muted)}

/* Listas */
.cl{display:flex;flex-direction:column}
.cl label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.cl label:first-child{border-top:0}
.cl input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);margin:0;display:grid;place-items:center;background:var(--surface)}
.cl input:checked{background:var(--ok);border-color:var(--ok)}
.cl input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.cl input:checked+span b{text-decoration:line-through;color:var(--muted)}
.cl span b{font-weight:600;display:block}
.cl span small{color:var(--muted);font-size:13px}
.cl span a{font-size:13px}
.ghead{display:flex;align-items:baseline;gap:8px}
.ghead span{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font:600 11px/1 var(--body);color:var(--muted);text-decoration:none;border-top:3px solid transparent;margin-top:-1px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.src{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="plaque" aria-hidden="true"><small>28 NOV · 1 DIC</small><b>PARIS</b></div>
    <div class="status">
      <strong id="st-when">París en 4 días</strong>
      <span id="st-prog">0 de 0 paradas hechas</span>
      <div class="bar" aria-hidden="true"><i id="st-bar" style="width:0"></i></div>
    </div>
  </header>

  <main id="main">
    <section class="view" id="v-plan" aria-label="Plan día a día"></section>
    <section class="view" id="v-mapa" aria-label="Mapa" hidden>
      <div class="chips" id="map-chips" role="group" aria-label="Filtrar por día"></div>
      <div class="mapwrap">
        <div id="map" role="img" aria-label="Mapa esquemático de París con las paradas del plan"></div>
        <div class="zoom">
          <button type="button" data-zoom="in" aria-label="Acercar">+</button>
          <button type="button" data-zoom="out" aria-label="Alejar">−</button>
          <button type="button" data-zoom="fit" aria-label="Encuadrar las paradas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
      <p class="src">Mapa esquemático sin conexión: arrastra para moverte, pellizca o usa + y − para acercar. Toca una parada para ver cómo llegar; la navegación paso a paso se abre en Google Maps.</p>
      <div class="legend" id="map-legend"></div>
    </section>
    <section class="view" id="v-transporte" aria-label="Transporte" hidden></section>
    <section class="view" id="v-guia" aria-label="Guía práctica" hidden></section>
    <section class="view" id="v-listas" aria-label="Listas" hidden></section>
  </main>

  <div class="sheet" id="sheet" role="dialog" aria-labelledby="sheet-title" hidden></div>

  <nav class="tabs" aria-label="Secciones">
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M11 5h9M11 12h7M11 19h9"/></svg>Plan</a>
    <a href="#mapa" data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.500 15.400 12 21 12 21z"/><circle cx="12" cy="10.500" r="2.300"/></svg>Mapa</a>
    <a href="#transporte" data-tab="transporte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.500-4M15 21l-1.500-4M9 14h.01M15 14h.01"/></svg>Transporte</a>
    <a href="#guia" data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.500A2.500 2.500 0 0 1 6.500 3H20v15H6.500A2.500 2.500 0 0 0 4 20.500z"/><path d="M4 20.500A2.500 2.500 0 0 0 6.500 23H20v-5M9 8h7"/></svg>Guía</a>
    <a href="#listas" data-tab="listas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l1.500 1.500L8 5M4 12l1.500 1.500L8 11M4 18l1.500 1.500L8 17M12 6h8M12 12h8M12 18h8"/></svg>Listas</a>
  </nav>
</div>

<script>
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

let cloud=null, cloudOk=false, writing=false, dirty=false, cloudTimer=null;
function save(){
  state.at=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(cloud){dirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(push,1200);}
}
async function push(){
  if(!cloud||writing||!dirty) return;
  writing=true; dirty=false;
  try{await cloud.set(JSON.parse(JSON.stringify(state)));cloudOk=true;}catch(e){cloudOk=false;}
  writing=false; syncNote();
  if(dirty) cloudTimer=setTimeout(push,1200);
}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/trip');
    const snap=await ref.get();
    cloud=ref; cloudOk=true;
    const remote=snap.exists?snap.data():null;
    if(remote&&(remote.at||0)>(state.at||0)){
      state=Object.assign(state,JSON.parse(JSON.stringify(remote)));
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
      renderAll();
    }else if(state.at&&(!remote||(remote.at||0)<state.at)){dirty=true;push();}
    syncNote();
  }catch(e){}
}

}

function smooth(ll){const p=ll.map(a=>XY(a[0],a[1]));let d=`M${p[0][0].toFixed(0)} ${p[0][1].toFixed(0)}`;
  for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(0)} ${(b[1]+(c[1]-a[1])/6).toFixed(0)} ${(c[0]-(e[0]-b[0])/6).toFixed(0)} ${(c[1]-(e[1]-b[1])/6).toFixed(0)} ${c[0].toFixed(0)} ${c[1].toFixed(0)}`;}
  return d;}
function mapPins(){
  const out=[],seen={};
  const days=ui.mapDay==='all'?DAYS.map((d,i)=>i):[ui.mapDay];
  days.forEach(di=>{let n=0;DAYS[di].stops.forEach(s=>{if(!s.p||seen[s.p])return;seen[s.p]=1;n++;out.push({id:s.p,day:di,n,stop:s});});});
  return out;
}
function mapSize(){const b=$('#map');return {pw:b.clientWidth||360,ph:b.clientHeight||380};}
function fit(){
  const {pw,ph}=mapSize(),pins=mapPins().map(p=>XY(P[p.id].lat,P[p.id].lon));
  const xs=pins.map(p=>p[0]),ys=pins.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  ui.mv={cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.max((x1-x0)*1.45,(y1-y0)*1.45*pw/ph,1700)};
}
function clampView(){const v=ui.mv;v.w=Math.min(15000,Math.max(700,v.w));v.cx=Math.min(WORLD.w,Math.max(0,v.cx));v.cy=Math.min(WORLD.h,Math.max(0,v.cy));}
function viewBox(){const {pw,ph}=mapSize(),v=ui.mv,h=v.w*ph/pw;return {x:v.cx-v.w/2,y:v.cy-h/2,w:v.w,h,s:v.w/pw,pw,ph};}
function renderMap(){
  if(ui.tab!=='mapa') return;
  if(!ui.mv) fit();
  clampView();
  const B=viewBox(),s=B.s,pins=mapPins();
  const rect=p=>{const [x,y]=XY(p.c[0],p.c[1]);return `<rect x="${x-p.w/2}" y="${y-p.h/2}" width="${p.w}" height="${p.h}" rx="${p.r||40}" transform="rotate(${p.a} ${x} ${y})" fill="var(--park)"/>`;};
  const isle=(o,halo)=>{const [x,y]=XY(o.c[0],o.c[1]);return `<ellipse cx="${x}" cy="${y}" rx="${halo?o.hx:o.rx}" ry="${halo?o.hy:o.ry}" transform="rotate(${o.a} ${x} ${y})" fill="var(--${halo?'water':'land'})"/>`;};
  let g=`<rect x="${B.x-2000}" y="${B.y-2000}" width="${B.w+4000}" height="${B.h+4000}" fill="var(--outside)"/>`;
  g+=`<polygon points="${CITY.map(a=>XY(a[0],a[1]).map(n=>n.toFixed(0)).join(',')).join(' ')}" fill="var(--land)" stroke="var(--line)" stroke-width="${2*s}" stroke-linejoin="round"/>`;
  g+=PARKS.map(rect).join('');
  g+=`<path d="${smooth(RIVER)}" fill="none" stroke="var(--water)" stroke-width="${Math.max(165,5*s)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=ISLES.map(o=>isle(o,1)).join('')+ISLES.map(o=>isle(o,0)).join('');

  g+=GARES.map(a=>{const [x,y]=XY(a[1],a[2]),r=4*s;return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="${1.5*s}" fill="var(--surface)" stroke="var(--muted)" stroke-width="${1.6*s}"/>`+(s<11?`<text x="${x+7*s}" y="${y+3.500*s}" font-size="${9.500*s}" fill="var(--muted)">${a[0]}</text>`:'')}).join('');
  if(ui.mapDay!=='all'&&pins.length>1) g+=`<polyline points="${pins.map(p=>XY(P[p.id].lat,P[p.id].lon).map(n=>n.toFixed(0)).join(',')).join(' ')}" fill="none" stroke="var(--d${ui.mapDay+1})" stroke-width="${3*s}" stroke-dasharray="${1*s} ${7*s}" stroke-linecap="round" opacity=".9"/>`;
  /* etiquetas sin solaparse */
  const px=pins.map(p=>{const [x,y]=XY(P[p.id].lat,P[p.id].lon);return {p,x,y,sx:(x-B.x)/s,sy:(y-B.y)/s};});
  const R=ui.mapDay==='all'?8:12, boxes=px.map(o=>[o.sx-R-2,o.sy-R-2,2*R+4,2*R+4]);
  const hit=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
  let labels='';
  px.forEach(o=>{const name=P[o.p.id].n.split(' · ')[0],w=name.length*6.200+8,h=15;
    const cands=[[o.sx+R+4,o.sy-h/2,'start',o.sx+R+5],[o.sx-R-4-w,o.sy-h/2,'end',o.sx-R-5],[o.sx-w/2,o.sy+R+3,'middle',o.sx],[o.sx-w/2,o.sy-R-3-h,'middle',o.sx]];
    for(const c of cands){const b=[c[0],c[1],w,h];
      if(b[0]<2||b[0]+w>B.pw-2||b[1]<2||b[1]+h>B.ph-2) continue;
      if(boxes.some(x=>hit(b,x))) continue;
      boxes.push(b);
      labels+=`<text x="${B.x+c[3]*s}" y="${B.y+(c[1]+11.500)*s}" text-anchor="${c[2]}" font-size="${11.500*s}" font-weight="600" fill="var(--ink)" stroke="var(--land)" stroke-width="${3.500*s}" paint-order="stroke" stroke-linejoin="round">${name}</text>`;break;}
  });
  g+=labels;
  g+=px.map(o=>`<g data-poi="${o.p.id}" style="cursor:pointer"><circle cx="${o.x}" cy="${o.y}" r="${(R+7)*s}" fill="transparent"/><circle cx="${o.x}" cy="${o.y}" r="${R*s}" fill="var(--d${o.p.day+1})" stroke="var(--surface)" stroke-width="${2.500*s}"/>${ui.mapDay==='all'?'':`<text x="${o.x}" y="${o.y+4.200*s}" text-anchor="middle" font-size="${12*s}" font-weight="700" fill="var(--on-day)">${o.p.n}</text>`}</g>`).join('');
  $('#map').innerHTML=`<svg viewBox="${B.x} ${B.y} ${B.w} ${B.h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`;
}

/* gestos del mapa */
(function(){
  const box=$('#map'),ptrs=new Map();let g=null;
  const setVB=()=>{const svg=$('svg',box);if(!svg)return;clampView();const B=viewBox();svg.setAttribute('viewBox',`${B.x} ${B.y} ${B.w} ${B.h}`);};
  const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  const mid=()=>{const a=[...ptrs.values()];return {x:a.reduce((t,p)=>t+p.x,0)/a.length,y:a.reduce((t,p)=>t+p.y,0)/a.length};};
  const begin=()=>{g={v:Object.assign({},ui.mv),m:mid(),d:ptrs.size>1?dist():0,moved:g?g.moved:0};};
  box.addEventListener('pointerdown',e=>{if(!ui.mv)return;try{box.setPointerCapture(e.pointerId);}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});g=null;begin();g.moved=0;});
  box.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!g)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const m=mid(),{pw}=mapSize();let w=g.v.w;if(ptrs.size>1&&g.d)w=g.v.w*g.d/dist();
    const s=w/pw;g.moved=Math.max(g.moved,Math.hypot(m.x-g.m.x,m.y-g.m.y),ptrs.size>1?10:0);
    ui.mv={w,cx:g.v.cx-(m.x-g.m.x)*s,cy:g.v.cy-(m.y-g.m.y)*s};setVB();});
  const end=e=>{if(!ptrs.has(e.pointerId))return;const moved=g?g.moved:0;ptrs.delete(e.pointerId);
    if(ptrs.size){begin();return;}
    if(moved<7&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY),poi=t&&t.closest('[data-poi]');if(poi){openSheet(poi.dataset.poi);return;}closeSheet();}
    g=null;renderMap();};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  let wt;box.addEventListener('wheel',e=>{if(!ui.mv)return;e.preventDefault();ui.mv.w*=e.deltaY>0?1.150:0.870;setVB();clearTimeout(wt);wt=setTimeout(renderMap,120);},{passive:false});
  window.addEventListener('resize',()=>{if(ui.tab==='mapa')renderMap();});
})();

function fareOptions(){
  const t=state.trips,a=HUB[state.arrive],d=HUB[state.depart];
  const hubs=a.cost()+d.cost(), inc=k=>(k==='cdg'||k==='ory');
  const single=t.reduce((x,n)=>x+n*F.metro,0)+hubs;
  const mixDays=t.map(n=>n*F.metro>F.jour);
  const mix=t.reduce((x,n)=>x+Math.min(n*F.metro,F.jour),0)+hubs;
  const pvIn=inc(state.arrive)?0:a.cost()-(state.arrive==='bva'?F.metro:a.cost());
  const pvOut=inc(state.depart)?0:d.cost()-(state.depart==='bva'?F.metro:d.cost());
  const pv5=F.pv[5]+pvIn+pvOut;
  const pv3=F.pv[3]+pvIn+t[3]*F.metro+d.cost();
  const o=[{k:'single',n:'Billetes sueltos',v:single,p:`${t.reduce((x,n)=>x+n,0)} billetes de metro a ${eur(F.metro)} más los traslados de llegada y salida. Se cargan en el móvil o en una tarjeta Navigo Easy.`}];
  if(mixDays.some(Boolean)) o.push({k:'mix',n:'Sueltos + Navigo Día',v:mix,p:`Pase de día (${eur(F.jour)}) el ${mixDays.map((m,i)=>m?DAYS[i].dow.toLowerCase():'').filter(Boolean).join(' y el ')}, y billetes sueltos el resto.`});
  o.push(pv5<=pv3?{k:'pv',n:'Paris Visite 5 días',v:pv5,p:'Viajes ilimitados e incluye los aeropuertos de CDG y Orly. No existe de 4 días, así que pagas uno de más.'}
                 :{k:'pv',n:'Paris Visite 3 días + salida',v:pv3,p:'Ilimitado de sábado a lunes con el aeropuerto de llegada incluido; el martes pagas la salida aparte.'});
  return o.sort((x,y)=>x.v-y.v);
}
function renderFare(){
  const o=fareOptions(),max=Math.max(...o.map(x=>x.v));
  $('#fare').innerHTML=o.map((x,i)=>`<div class="opt${i===0?' best':''}"><div class="l1"><b>${x.n}</b>${i===0?'<span class="pill ok">Lo más barato</span>':''}<span class="amt">${eur(x.v)}</span></div><div class="bar"><i style="width:${100*x.v/max}%"></i></div><p>${x.p}</p></div>`).join('')
   +`<div class="opt"><div class="l1"><b>Navigo Semana</b><span class="pill warn">No encaja</span><span class="amt">${eur(F.semaine)}</span></div><p>Va siempre de lunes a domingo. Tu viaje cae en dos semanas distintas (sábado y domingo de una, lunes y martes de la otra), así que necesitarías dos pases.</p></div>`;
}

  <div class="tiles">
    <div class="tile"><small>Temperatura</small><b>4–9 °C</b><span>Lluvia fina uno de cada dos días</span></div>
    <div class="tile"><small>Luz de día</small><b>8:20–16:58</b><span>Lo exterior, antes de las 17:00</span></div>
    <div class="tile"><small>Emergencias</small><b>112</b><span>Policía 17 · Médicas 15 · Bomberos 18</span></div>
    <div class="tile"><small>Propina</small><b>Incluida</b><span>«Service compris». Redondear es un detalle</span></div>
    <div class="tile"><small>Enchufe</small><b>Tipo E · 230 V</b><span>El europeo de dos clavijas sirve</span></div>
    <div class="tile"><small>Agua</small><b>Del grifo</b><span>Potable y gratis en restaurantes</span></div>
  </div>

  <div><h2 class="h2">Entradas y días de cierre</h2></div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Lugar</th><th>Precio adulto</th><th>Cierra</th></tr></thead>
    <tbody>${sights.map(([k,c])=>`<tr><td><b>${P[k].n}</b></td><td>${P[k].pr}</td><td class="n">${c}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="note"><b>Gratis si eres joven.</b> Menores de 18 años de cualquier país y residentes de la UE menores de 26 entran gratis en el Louvre, Orsay, Sainte-Chapelle y el Arco del Triunfo. Lleva el DNI y reserva igualmente la franja horaria a 0 €.</div>
  <p class="tip"><b>¿Paris Museum Pass?</b> El de 2 días ronda los 85 € y cubre 48 horas seguidas: justo de la Sainte-Chapelle del sábado al Louvre del lunes por la mañana, con Orsay y el Arco entre medias. Esas cuatro entradas sueltas suman 70 € si resides en el EEE, así que no compensa. Con pasaporte de fuera del EEE suman 86 €: queda empatado y el pase añade gratis el Panteón o la Conciergerie. La Torre Eiffel, la Ópera y el crucero nunca están incluidos.</p>
  <p class="src">Precios de 2026 consultados el 20 de noviembre de 2026. Las huelgas pueden cerrar un monumento sin aviso: revisa su web esa misma mañana.</p></div>

  <div><h2 class="h2">Presupuesto orientativo</h2><p class="lead">Por persona, sin vuelos ni hotel.</p></div>
  <div class="card"><div class="tw"><table>
    <tbody>
      <tr><td><b>Transporte</b><br><span class="src">Aeropuerto ida y vuelta + 8 trayectos</span></td><td class="n">≈ ${eur(2*F.airport+8*F.metro)}</td></tr>
      <tr><td><b>Entradas</b><br><span class="src">Torre, Louvre, Orsay, Sainte-Chapelle, Arco, Ópera, crucero</span></td><td class="n">125–165 €</td></tr>
      <tr><td><b>Comida</b><br><span class="src">Panadería, almuerzo sencillo y cena de bistró</span></td><td class="n">45–65 € al día</td></tr>
      <tr><td><b>Total 4 días</b></td><td class="n"><b>335–445 €</b></td></tr>
    </tbody></table></div></div>

  <div><h2 class="h2">Comer bien sin arruinarse</h2></div>
  <div class="card"><ul class="bul">
    <li><b>Horarios:</b> almuerzo de 12:00 a 14:00 y cena de 19:00 a 22:00. Fuera de esas horas busca una «brasserie» con «service continu».</li>
    <li><b>Formule midi:</b> plato con entrante o postre por 16–22 €, de lunes a viernes. Es la mejor relación calidad-precio.</li>
    <li><b>Panaderías:</b> bocadillo jambon-beurre 5–6 €, quiche 4 €, menú con bebida y postre 9–11 €.</li>
    <li><b>Agua y pan:</b> pide «une carafe d’eau». El agua del grifo y el pan son gratis siempre.</li>
    <li><b>Café:</b> en la barra cuesta 1,50–2 €; el mismo café sentado en terraza, 3–5 €.</li>
    <li><b>Qué probar:</b> soupe à l’oignon, croque-monsieur, confit de canard, steak-frites, bœuf bourguignon, crêpe de mantequilla y azúcar, macarons y, en esta época, vin chaud.</li>
    <li><b>Domingo y lunes:</b> cierran muchos restaurantes. Ten localizado dónde vas a cenar.</li>
  </ul></div>

  <div><h2 class="h2">Francés de supervivencia</h2><p class="lead">Saluda siempre con «Bonjour» al entrar en cualquier sitio. Cambia por completo el trato.</p></div>
  <div class="card"><div class="phr">
    ${[['Bonjour / Bonsoir','bon-YUR / bon-SUAR','Buenos días / Buenas tardes'],['Merci beaucoup','mer-SÍ bo-KÚ','Muchas gracias'],['S’il vous plaît','sil vu PLE','Por favor'],['Excusez-moi','ex-kü-sé MUÁ','Perdone'],['Parlez-vous espagnol ?','par-lé VU es-pa-ÑOL','¿Habla español?'],['Je voudrais…','ye vu-DRE','Quisiera…'],['L’addition, s’il vous plaît','la-di-SIÓN','La cuenta, por favor'],['Une carafe d’eau','ün ka-RAF DO','Una jarra de agua'],['Où est le métro ?','u E le me-TRÓ','¿Dónde está el metro?'],['Un billet, s’il vous plaît','an bi-YÉ','Un billete, por favor'],['C’est combien ?','se kom-BIÁN','¿Cuánto cuesta?'],['Je ne comprends pas','ye ne kom-PRAN pa','No entiendo']].map(r=>`<div><b>${r[0]}</b><i>${r[1]}</i></div><div>${r[2]}</div>`).join('')}
  </div></div>

  <div><h2 class="h2">Seguridad y timos habituales</h2></div>
  <div class="card"><ul class="bul">
    <li><b>Carteristas:</b> actúan en el metro 1, el RER B, la Torre Eiffel, el Louvre y Montmartre. Móvil fuera del bolsillo trasero y bolso cerrado por delante, sobre todo al cerrarse las puertas del vagón.</li>
    <li><b>La pulsera:</b> en la escalinata del Sacré-Cœur te atan un hilo a la muñeca y exigen dinero. Manos en los bolsillos y sigue andando.</li>
    <li><b>La petición de firmas:</b> jóvenes con una carpeta piden firmar por una causa y luego dinero, o distraen mientras otro roba. Di «non, merci» sin pararte.</li>
    <li><b>El anillo de oro:</b> alguien «encuentra» un anillo a tus pies y te lo ofrece a cambio de una propina. No vale nada.</li>
    <li><b>Trileros:</b> el juego de los cubiletes bajo la Torre Eiffel está amañado y los que ganan son cómplices.</li>
    <li><b>Taxis:</b> solo los de la fila oficial, con luz «Taxi Parisien» en el techo y tarifa plana desde los aeropuertos.</li>
    <li><b>Terrazas:</b> no dejes el móvil sobre la mesa.</li>
  </ul></div>

  <div><h2 class="h2">Si llueve</h2></div>
  <div class="card"><ul class="bul">
    <li>Los museos del plan ya son a cubierto. Adelanta la Ópera Garnier y las Galeries Lafayette.</li>
    <li>Pasajes cubiertos encadenados: Galerie Vivienne, Passage des Panoramas, Passage Jouffroy y Passage Verdeau.</li>
    <li>Panteón (${L('B')} Luxembourg): tumbas de Victor Hugo y Marie Curie y el péndulo de Foucault.</li>
    <li>Musée de l’Orangerie, en las Tullerías: los Nenúfares de Monet en dos salas ovaladas. Cierra los martes.</li>
    <li>Un chocolate caliente espeso en un salón de té también cuenta como visita.</li>
  </ul></div>

  <div><h2 class="h2">Costumbres que ayudan</h2></div>
  <div class="card"><ul class="bul">
    <li>Los aseos públicos de la calle (cabinas grises) son gratuitos. En cafés, consume algo antes de pedir el baño.</li>
    <li>Los domingos cierra buena parte del comercio, salvo Le Marais, Campos Elíseos, Montmartre y los grandes almacenes.</li>
    <li>En los museos hay control de bolsos: viaja sin mochila grande y pasarás antes. Las maletas no se admiten.</li>
    <li>Las farmacias llevan una cruz verde luminosa. Para algo leve, el farmacéutico aconseja sin receta.</li>
  </ul></div>

  <div><h2 class="h2">Aplicaciones útiles</h2></div>
  <div class="card"><ul class="bul">
    <li><b>Île-de-France Mobilités:</b> billetes en el móvil y rutas oficiales.</li>
    <li><b>Bonjour RATP:</b> horarios en tiempo real y avisos de incidencias.</li>
    <li><b>Citymapper:</b> la mejor para elegir vagón y salida en cada transbordo.</li>
    <li><b>Google Maps sin conexión:</b> descarga la ciudad antes de salir.</li>
    <li><b>TheFork:</b> reservas de restaurante con descuentos.</li>
  </ul></div>`;
}

/* ============ Listas ============ */
function renderLists(){
  const done=LISTS.reduce((a,g)=>a+g.items.filter(i=>state.lists[i.id]).length,0);
  $('#v-listas').innerHTML=`
  <div><h2 class="h2">Preparativos</h2><p class="lead">${done} de ${LTOTAL} listos. Marca cada cosa cuando la tengas.</p></div>
  ${LISTS.map(g=>`<div class="card"><div class="ghead"><h3 class="h3">${g.t}</h3><span>${g.items.filter(i=>state.lists[i.id]).length}/${g.items.length}</span></div>${g.d?`<p class="lead">${g.d}</p>`:''}
    <div class="cl">${g.items.map(i=>`<label><input type="checkbox" id="cl-${i.id}" data-list="${i.id}"${state.lists[i.id]?' checked':''}><span><b>${i.b}</b>${i.s?`<small>${i.s}</small>`:''}${i.u?` <a href="${i.u}" target="_blank" rel="noopener">Abrir web oficial</a>`:''}</span></label>`).join('')}</div></div>`).join('')}
  <div class="card"><p class="src" id="sync"></p>
    <div class="acts">${ui.confirmReset?`<button type="button" class="btn pri" data-reset="yes">Sí, borrar todas mis marcas</button><button type="button" class="btn" data-reset="no">Cancelar</button>`:`<button type="button" class="btn" data-reset="ask">Borrar todas mis marcas</button>`}</div></div>`;
  syncNote();
}

/* ============ Navegación y eventos ============ */
const TABS=['plan','mapa','transporte','guia','listas'];
function show(tab){
  const main=$('#main');ui.scroll[ui.tab]=main.scrollTop;ui.tab=tab;
  TABS.forEach(t=>{$('#v-'+t).hidden=t!==tab;});
  $$('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  closeSheet();
  if(tab==='mapa') renderMapUI();
  main.scrollTop=ui.scroll[tab]||0;
}
function route(){const h=location.hash.slice(1),t=TABS.includes(h)?h:'plan';if(t!==ui.tab||!$('.tabs a[aria-current]'))show(t);}
function renderAll(){renderStatus();renderPlan();renderTransport();renderGuide();renderLists();if(ui.tab==='mapa')renderMapUI();}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-check],[data-day],[data-map],[data-mapday],[data-poi],[data-close],[data-zoom],[data-hub],[data-trip],[data-reset]');
  if(!t) return;
  const d=t.dataset;
  if(d.check){state.checks[d.check]=!state.checks[d.check];if(!state.checks[d.check])delete state.checks[d.check];save();renderStatus();renderPlan();const b=$(`[data-check="${d.check}"]`);if(b)b.focus({preventScroll:true});}
  else if(d.day!==undefined){ui.day=+d.day;renderPlan();$('#main').scrollTop=0;}
  else if(d.map){ui.mapDay=DAYS.findIndex(x=>x.stops.some(s=>s.p===d.map));ui.mv=null;location.hash='mapa';if(ui.tab!=='mapa')show('mapa');else renderMapUI();openSheet(d.map);}
  else if(d.mapday!==undefined){ui.mapDay=d.mapday==='all'?'all':+d.mapday;ui.mv=null;closeSheet();renderMapUI();}
  else if(d.poi&&t.closest('#map-legend')){const p=P[d.poi],[x,y]=XY(p.lat,p.lon);ui.mv={cx:x,cy:y,w:Math.min(ui.mv?ui.mv.w:2200,2200)};renderMap();$('#main').scrollTop=0;openSheet(d.poi);}
  else if(d.close!==undefined){closeSheet();}
  else if(d.zoom){if(d.zoom==='fit')ui.mv=null;else if(ui.mv)ui.mv.w*=d.zoom==='in'?0.650:1.540;renderMap();}
  else if(d.hub){const [k,v]=d.hub.split(':');state[k]=v;save();renderTransport();renderPlan();}
  else if(d.trip){const [i,n]=d.trip.split(':').map(Number);state.trips[i]=Math.max(0,Math.min(12,state.trips[i]+n));save();$('#trip'+i).textContent=state.trips[i];renderFare();}
  else if(d.reset){if(d.reset==='ask')ui.confirmReset=true;else{if(d.reset==='yes'){state.checks={};state.lists={};save();}ui.confirmReset=false;}renderStatus();renderPlan();renderLists();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.list){if(t.checked)state.lists[t.dataset.list]=true;else delete state.lists[t.dataset.list];save();renderLists();const b=$('#cl-'+t.dataset.list);if(b)b.focus({preventScroll:true});}
  else if(t.id==='hotel'){state.hotel=t.value.trim().slice(0,120);save();renderHubs();renderPlan();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
window.addEventListener('hashchange',route);

renderAll();route();cloudInit();

/* Instalable y sin conexión cuando se aloja como web propia (fuera de un marco) */
if(window.top===window.self&&'serviceWorker' in navigator&&location.protocol==='https:'){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
